; 仅供 Shadowrocket 使用的 subconverter 模板；OpenClash / Clash Mi 继续使用 clash.ini，请勿替换。
; Shadowrocket 不支持 GEOSITE，也没有 geosite.dat。
; 专项域名使用 MetaCubeX meta-rules-dat clash-domain 规则集，
; 使用以 payload: 开头的 .yaml，让 subconverter 将 +.domain 转成 DOMAIN-SUFFIX、精确域名转成 DOMAIN。
; 通过局域网 subconverter 推荐订阅：target=clash&url=<机场订阅>&config=<shadowrocket.ini 的 raw URL>&emoji=false&udp=true
; target=surge 会丢弃 VLESS / AnyTLS 节点，不适用于本订阅。
; target=clash 会将规则集内联到生成的 YAML（无 GEOSITE），无需配置 managed_config_prefix。
; IPv6 局域网规则使用 []IP-CIDR6，让 clash target 输出 IP-CIDR6，而非 Surge 的 IP6-CIDR。
; 为缩小 Shadowrocket 配置，移除两份 MetaCubeX 大名单：cn（约 11 万条）、geolocation-!cn（约 2.7 万条）。
; 规则顺序：局域网 > 专项目标组 > GEOIP,CN > FINAL。
; 未列入名单的域名经 DNS 解析后，CN IP 走国内 / 直连，其余走国外（FINAL）；取舍是依赖解析 IP 判断归属。
; 个别应用若分流不准，后续可添加单独规则修正。
; 不添加 Steam / PSN DIRECT 规则（这些仅在路由器上使用）。
; 保留 select 与区域 url-test 策略组，不添加 Smart 组。

[custom]
enable_rule_generator=true
overwrite_original_rules=true

; ========================
; 规则集
; ========================

; 局域网 / 私有域名。国内组默认只有「直连」。
ruleset=国内,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=国内,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=国内,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=国内,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=国内,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=国内,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=国内,[]IP-CIDR6,fc00::/7,no-resolve
ruleset=国内,[]IP-CIDR6,fe80::/10,no-resolve
ruleset=国内,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.yaml

; Apple TV 的 F1 仅限美区：Apple TV 目录/播放域名走 Apple TV 组（默认美国）
ruleset=Apple TV,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-tvplus.yaml

; Apple/iCloud 国内服务与飞书直连（不含 Apple TV 播放域名）
ruleset=国内,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-cn.yaml
ruleset=国内,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/icloud.yaml
ruleset=国内,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/feishu.yaml
ruleset=国内,[]DOMAIN-SUFFIX,larkoffice.com

; AI 必须在 Microsoft 之前（category-ai-!cn 含 Gemini/Copilot/OpenAI 等）
ruleset=AI,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.yaml

; 微软国内可直连部分（Windows 更新、Office CDN 等）
ruleset=国内,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft@cn.yaml
ruleset=Microsoft,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.yaml

ruleset=Broker,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/futu.yaml

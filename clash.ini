[custom]
; OpenClash / Mihomo（Meta、Smart 核心）订阅转换模板。
; 供局域网 subconverter 生成配置，再由 OpenClash（fake-ip + TUN，china_ip_route）加载。
;
; 大名单不再使用 clash-domain / clash-ipcidr / clash-classic 下载后展开。
; subconverter 遇到 [] 前缀会原样输出一条规则，因此无论请求是否带 expand=false，
; 都不会把 CN / 非 CN / 常见站点写成十几万条 DOMAIN-SUFFIX。
; 这些类别来自 MetaCubeX geosite.dat / geoip.dat（OpenClash 的 GeoSite、GeoIP Dat）。
; 回滚：同目录 clash.ini.bak 是展开大名单的旧模板。
;
; 命中顺序：局域网 > 专项目标组 > 非 CN / CN 大名单 > 其他。

enable_rule_generator=true
overwrite_original_rules=true

; ========================
; 规则集
; ========================

; 局域网 / 私有域名。国内组默认只有「直连」。
ruleset=国内,[]GEOSITE,private

; AI 必须在 Microsoft 之前（category-ai-!cn 含 Gemini/Copilot/OpenAI 等）
ruleset=AI,[]GEOSITE,category-ai-!cn

ruleset=Microsoft,[]GEOSITE,microsoft

ruleset=Broker,[]GEOSITE,futu
ruleset=Broker,[]GEOSITE,longbridge
ruleset=Broker,[]GEOSITE,ibkr
ruleset=Broker,[]GEOSITE,itiger
ruleset=Broker,[]GEOSITE,schwab

ruleset=Stream Media,[]GEOSITE,tiktok
ruleset=Stream Media,[]GEOSITE,netflix
ruleset=Stream Media,[]GEOSITE,disney
ruleset=Stream Media,[]GEOSITE,primevideo
ruleset=Stream Media,[]GEOSITE,hbo
ruleset=Stream Media,[]GEOSITE,spotify
ruleset=Stream Media,[]GEOSITE,youtube

ruleset=Games,[]GEOSITE,steam
ruleset=Games,[]GEOSITE,epicgames
ruleset=Games,[]GEOSITE,ea
ruleset=Games,[]GEOSITE,blizzard
ruleset=Games,[]GEOSITE,ubisoft
ruleset=Games,[]GEOSITE,playstation
ruleset=Games,[]GEOSITE,nintendo
ruleset=Games,[]GEOSITE,2kgames

; 代替 blackmatrix7 Global.list（约 1MB，展开后数万条 DOMAIN-SUFFIX）
ruleset=国外,[]GEOSITE,geolocation-!cn
; 代替 meta-rules-dat geosite/cn.yaml（约 2.2MB）与 geoip/cn.yaml
ruleset=国内,[]GEOSITE,cn
ruleset=国内,[]GEOIP,CN,no-resolve

ruleset=其他,[]FINAL

; ========================
; 策略组
; ========================
custom_proxy_group=国外`select`[]香港-自动`[]直连`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]拒绝
custom_proxy_group=AI`select`[]台湾-自动`[]直连`[]香港-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]拒绝
custom_proxy_group=Microsoft`select`[]香港-自动`[]直连`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]拒绝
custom_proxy_group=Stream Media`select`[]香港-自动`[]直连`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]拒绝
custom_proxy_group=Games`select`[]香港-自动`[]直连`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]拒绝
custom_proxy_group=Broker`select`[]香港-自动`[]直连`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]拒绝
custom_proxy_group=其他`select`[]国外`[]国内
custom_proxy_group=国内`select`[]直连
custom_proxy_group=直连`select`[]DIRECT
custom_proxy_group=拒绝`select`[]REJECT

custom_proxy_group=香港-自动`url-test`(?!.*IPv6)(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=台湾-自动`url-test`(?!.*IPv6)(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|TaiWan|Taiwan)).*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=日本-自动`url-test`(?!.*IPv6)(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=新加坡-自动`url-test`(?!.*IPv6)(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=美国-自动`url-test`(?!.*IPv6)(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$`https://www.gstatic.com/generate_204`300,,50
